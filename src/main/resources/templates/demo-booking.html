
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Booking | KMIE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172554;
        }

        header {
            background: #142b52;
            padding: 18px 8%;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
            color: #54c8f5;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 25px #00000012;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #16b5d5;
            color: #082f49;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #38c8e4;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 14px;
            border-radius: 7px;
            margin: 20px 0;
        }

        .info {
            background: #eff6ff;
            padding: 14px;
            border-radius: 7px;
            color: #1e40af;
            margin-top: 20px;
            line-height: 1.6;
        }

        .home-link {
            display: inline-block;
            margin-top: 20px;
            color: #142b52;
        }

        @media (max-width: 700px) {
            .container {
                margin: 20px;
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>KMIE</h2>
    <a href="/">Home</a>
</header>

<div class="container">

    <h1>Book Your Demo Class</h1>

    <p class="subtitle">
        Select your preferred date and time
        for a NEET or JEE demo class.
    </p>

    <div class="info">
        Please enter the mobile number used when
        submitting your Student Enquiry.
        If you have not registered yet,
        <a href="/enquiry">submit an enquiry first</a>.
    </div>

    <div th:if="${error}"
         th:text="${error}"
         class="error-message"
         role="alert">
    </div>

    <form th:action="@{/demo-booking}" method="post">

        <!-- Spring Security CSRF protection -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="phone">
            Registered Mobile Number *
        </label>

        <input type="tel"
               id="phone"
               name="phone"
               pattern="[0-9]{10}"
               minlength="10"
               maxlength="10"
               placeholder="Enter registered mobile number"
               title="Enter exactly 10 digits"
               required>

        <label for="demoDate">
            Preferred Demo Date *
        </label>

        <input type="date"
               id="demoDate"
               name="demoDate"
               th:attr="min=${today}"
               required>

        <label for="demoTime">
            Preferred Time Slot *
        </label>

        <select id="demoTime"
                name="demoTime"
                required>

            <option value="">
                Select a time slot
            </option>

            <option value="13:00">
                1 PM
            </option>

            <option value="15:00">
                3 PM
            </option>

            <option value="17:00">
                5 PM
            </option>

            <option value="19:00">
                7 PM
            </option>

        </select>

        <button type="submit">
            Confirm Demo Booking
        </button>

    </form>

    <a class="home-link" href="/">
        Back to Home
    </a>

</div>

</body>
</html>
