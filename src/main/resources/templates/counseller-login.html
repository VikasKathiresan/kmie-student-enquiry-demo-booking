<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counsellor Login | KMIE</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172554;
        }

        main {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-top: 5px solid #16b5d5;
            box-shadow: 0 8px 25px #00000012;
        }

        h1 {
            margin: 0 0 8px;
        }

        p {
            color: #64748b;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            background: #142b52;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            background: #fee2e2;
            color: #991b1b;
        }

        .logout-message {
            background: #dcfce7;
            color: #166534;
        }

        .home-link {
            display: inline-block;
            margin-top: 20px;
            color: #142b52;
        }
    </style>
</head>
<body>
<main>
    <h1>Counsellor Sign In</h1>
    <p>Sign in to review enquiries and approve demo bookings.</p>

    <div class="message" th:if="${param.error}" role="alert">
        Username or password is incorrect.
    </div>
    <div class="message logout-message" th:if="${param.logout}" role="status">
        You have been signed out.
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label for="username">Username</label>
        <input id="username"
               name="username"
               type="text"
               autocomplete="username"
               required
               autofocus>

        <label for="password">Password</label>
        <input id="password"
               name="password"
               type="password"
               autocomplete="current-password"
               required>

        <button type="submit">Sign In</button>
    </form>

    <a class="home-link" href="/">Back to home</a>
</main>
</body>
</html>
